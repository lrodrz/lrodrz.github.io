<footer class="site-footer">
  <div class="shell footer-grid">
    <div>
      <a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <p>{{ site.description | escape }}</p>
    </div>
    <nav class="footer-nav" aria-label="Footer navigation">
      {% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}
    </nav>
  </div>
  <div class="shell footer-bottom">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author | escape }}</p>
    {% include socials.html %}
  </div>
</footer>
