# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Larry's Blog
author: Larry Rodriguez
timezone: America/Los_Angeles
#email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Larry Rodriguez's personal blog about computational biophysics, molecular
  simulation, artificial intelligence, chemistry, gene editing, and beyond.
tagline: Scientific notes on molecules, computation, and the process of learning.
sidebar_description: Computational biophysicist writing about molecular simulation, machine learning, chemistry, and research in progress.
home_hero_image: "https://raw.githubusercontent.com/lrodrz/blog_images/main/june2026/IMG_0946.jpg"
# home_hero_image_small: external image has no responsive derivative; single src is used
home_hero_alt: "Rocky coastline beneath a clear blue sky"
default_hero_image: "/assets/images/placeholders/global-hero.svg"
default_page_hero_image: "/assets/images/placeholders/page-hero.svg"
default_post_hero_image: "/assets/images/placeholders/post-hero.svg"
profile_image: "https://raw.githubusercontent.com/lrodrz/blog_images/main/june2026/IMG_0057%20-%20Copy.JPG"
social_image: "/assets/images/placeholders/social-card.svg"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://lrodrz.github.io"
twitter_username: lrodrz1
github_username:  lrodrz
youtube: Larry Rodriguez
youtube_channel: UCtZ_cpSlK51Qhw4ZxPAmNVQ
youtube_channel_name: Larry Rodriguez
markdown: kramdown
# Let MathJax 3 own all math rendering. With no math engine, kramdown leaves
# the $$...$$ delimiters intact (wrapped in a .math span/div) instead of
# emitting MathJax-2 <script type="math/tex"> tags that MathJax 3 ignores.
kramdown:
  math_engine: null
paginate: 5
paginate_path: "/page:num/"
